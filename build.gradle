plugins {
    id 'net.fabricmc.fabric-loom-remap' version '1.15.5' apply false
    id 'net.neoforged.moddev' version '2.0.141' apply false
    id 'net.minecraftforge.gradle' version '7.0.40' apply false
}

tasks.register('buildAllMods') {
    group = 'build'
    description = 'Builds all supported mod loader JARs and the Universal multi-loader JAR.'
    dependsOn ':fabric:build', ':quilt:build', ':neoforge:build', ':forge:build', 'universalJar'
}

// Universal Multi-Loader JAR Task
tasks.register('universalJar', Jar) {
    group = 'build'
    description = 'Builds a single universal JAR supporting Fabric, Quilt, NeoForge, and Forge.'
    archiveBaseName = "${project.findProperty('jar_base_name') ?: mod_id}-${minecraft_version}"
    archiveVersion = "${version}"
    destinationDirectory = layout.buildDirectory.dir('libs')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    dependsOn ':fabric:jar', ':quilt:jar', ':neoforge:jar', ':forge:jar'

    from {
        [
            project(':fabric').tasks.jar.archiveFile,
            project(':quilt').tasks.jar.archiveFile,
            project(':neoforge').tasks.jar.archiveFile,
            project(':forge').tasks.jar.archiveFile
        ].collect { zipTree(it) }
    }

    manifest {
        attributes([
            'Specification-Title'   : mod_name,
            'Specification-Vendor'  : mod_author,
            'Specification-Version' : project.version,
            'Implementation-Title'  : "${mod_name} Multi-Loader",
            'Implementation-Version': project.version,
            'Implementation-Vendor' : mod_author,
            'Built-On-Minecraft'    : minecraft_version,
            'Fabric-Loom-Remap'     : 'false',
            'MixinConfigs'          : "${project.findProperty('mod_id') ?: 'evv'}.mixins.json"
        ])
    }
}

tasks.register('copyUniversalJar') {
    group = 'distribution'
    description = 'Copies the Universal JAR to the MultiMC 26.3 instance and the user Downloads folder.'
    dependsOn 'universalJar'

    doLast {
        def jarFile = tasks.named('universalJar', Jar).get().archiveFile.get().asFile
        if (!jarFile.exists()) {
            throw new GradleException("Universal JAR not found at ${jarFile.absolutePath}")
        }

        def destinations = [
            file("D:/MultiMC/instances/${minecraft_version}/.minecraft/mods"),
            file("${System.getProperty('user.home')}/Downloads")
        ]
        def altMultiMcMods = file("D:/MultiMC/instances/${minecraft_version}/mods")
        if (altMultiMcMods.exists()) {
            destinations.add(altMultiMcMods)
        }

        destinations.each { targetDir ->
            if (!targetDir.exists()) {
                targetDir.mkdirs()
            }

            // Remove any previous versions of this mod in the target directory
            targetDir.listFiles()?.each { existingFile ->
                if ((existingFile.name.startsWith("villagerai-") ||
                     existingFile.name.startsWith("evv-") ||
                     existingFile.name.startsWith("easy-vanilla-villagers-")) && existingFile.name.endsWith('.jar')) {
                    existingFile.delete()
                    println "Removed old mod jar: ${existingFile.name} from ${targetDir.absolutePath}"
                }
            }

            copy {
                from jarFile
                into targetDir
            }
            println "Copied ${jarFile.name} -> ${targetDir.absolutePath}"
        }
    }
}

universalJar.finalizedBy('copyUniversalJar')

tasks.register('buildUniversalJar') {
    group = 'build'
    description = 'Builds and deploys the Universal multi-loader JAR.'
    dependsOn 'universalJar', 'copyUniversalJar'
}

