plugins {
    id 'net.fabricmc.fabric-loom-remap' version '1.15.5' apply false
    id 'net.neoforged.moddev' version '2.0.141' apply false
    id 'net.minecraftforge.gradle' version '7.0.40' apply false
    id 'io.github.pacifistmc.forgix' version '2.0.0'
}

allprojects {
    version = project.version
    group = project.group
}

// Disable default root jar since this is a multi-project container
tasks.named('jar') {
    enabled = false
}

def hasMultipleLoaders = [findProject(':fabric'), findProject(':neoforge'), findProject(':forge'), findProject(':quilt')].count { it != null } > 1

if (hasMultipleLoaders) {
    forgix {
        archiveBaseName = "${project.findProperty('jar_base_name') ?: mod_id}-${minecraft_version}"
        archiveClassifier = ""
        destinationDirectory = layout.buildDirectory.dir("libs")
        autoRun = true
    }
}

gradle.projectsEvaluated {
    if (hasMultipleLoaders) {
        forgix {
            if (findProject(':fabric') != null) {
                fabric {
                    def task = project(':fabric').tasks.findByName('remapJar') != null ?
                        project(':fabric').tasks.named('remapJar') : project(':fabric').tasks.named('jar')
                    inputJar = task.flatMap { it.archiveFile }
                }
            }
            if (findProject(':neoforge') != null) {
                neoforge {
                    def task = project(':neoforge').tasks.findByName('remapJar') != null ?
                        project(':neoforge').tasks.named('remapJar') : project(':neoforge').tasks.named('jar')
                    inputJar = task.flatMap { it.archiveFile }
                }
            }
            if (findProject(':forge') != null) {
                forge {
                    def task = project(':forge').tasks.findByName('remapJar') != null ?
                        project(':forge').tasks.named('remapJar') : project(':forge').tasks.named('jar')
                    inputJar = task.flatMap { it.archiveFile }
                }
            }
            if (findProject(':quilt') != null) {
                quilt {
                    def task = project(':quilt').tasks.findByName('remapJar') != null ?
                        project(':quilt').tasks.named('remapJar') : project(':quilt').tasks.named('jar')
                    inputJar = task.flatMap { it.archiveFile }
                }
            }
        }

        tasks.named('mergeJars').configure {
            if (findProject(':fabric') != null) {
                dependsOn(project(':fabric').tasks.findByName('remapJar') != null ?
                    project(':fabric').tasks.named('remapJar') : project(':fabric').tasks.named('jar'))
            }
            if (findProject(':neoforge') != null) {
                dependsOn(project(':neoforge').tasks.findByName('remapJar') != null ?
                    project(':neoforge').tasks.named('remapJar') : project(':neoforge').tasks.named('jar'))
            }
            if (findProject(':forge') != null) {
                dependsOn(project(':forge').tasks.findByName('remapJar') != null ?
                    project(':forge').tasks.named('remapJar') : project(':forge').tasks.named('jar'))
            }
            if (findProject(':quilt') != null) {
                dependsOn(project(':quilt').tasks.findByName('remapJar') != null ?
                    project(':quilt').tasks.named('remapJar') : project(':quilt').tasks.named('jar'))
            }
        }
    }
}

if (hasMultipleLoaders) {
    tasks.register('universalJar') {
        group = 'forgix'
        description = 'Merges all modloader jars into a single universal jar'
        dependsOn('mergeJars')
        doLast {
            def mergedDir = layout.buildDirectory.dir("libs").get().asFile
            def jarFile = mergedDir.listFiles()?.find { it.name.startsWith("${project.findProperty('jar_base_name') ?: mod_id}-${minecraft_version}") && it.name.endsWith('.jar') }
            if (jarFile != null && jarFile.exists()) {
                def uri = URI.create("jar:" + jarFile.toURI())
                def env = [create: 'false']
                java.nio.file.FileSystems.newFileSystem(uri, env).withCloseable { fs ->
                    def manifestPath = fs.getPath("META-INF/MANIFEST.MF")
                    if (java.nio.file.Files.exists(manifestPath)) {
                        def manifest = new java.util.jar.Manifest(java.nio.file.Files.newInputStream(manifestPath))
                        manifest.mainAttributes.putValue("MixinConfigs", "${project.findProperty('mod_id') ?: 'evv'}.mixins_forge.json")
                        java.nio.file.Files.newOutputStream(manifestPath).withCloseable { os ->
                            manifest.write(os)
                        }
                        println "Updated Universal JAR MANIFEST.MF: MixinConfigs = ${project.findProperty('mod_id') ?: 'evv'}.mixins_forge.json"
                    }
                }
            }
        }
    }
}

tasks.register('buildAllMods') {
    group = 'build'
    description = 'Builds all supported mod loader JARs and the Universal multi-loader JAR.'
    dependsOn ':fabric:build', ':quilt:build', ':neoforge:build', ':forge:build', 'universalJar'
}

tasks.register('buildUniversalJar') {
    group = 'build'
    description = 'Builds and deploys the Universal multi-loader JAR.'
    dependsOn 'universalJar', 'copyUniversalJar'
}

tasks.register('copyUniversalJar') {
    group = 'distribution'
    description = 'Copies the Universal JAR to the MultiMC instance and the user Downloads folder.'
    dependsOn 'universalJar'

    doLast {
        def mergedDir = layout.buildDirectory.dir("libs").get().asFile
        def jarFile = mergedDir.listFiles()?.find { it.name.startsWith("${project.findProperty('jar_base_name') ?: mod_id}-${minecraft_version}") && it.name.endsWith('.jar') }
        if (jarFile == null || !jarFile.exists()) {
            throw new GradleException("Universal JAR not found in ${mergedDir.absolutePath}")
        }

        def destinations = [
            file("D:/MultiMC/instances/${minecraft_version}/.minecraft/mods"),
            file("${System.getProperty('user.home')}/Downloads")
        ]
        def altMultiMcMods = file("D:/MultiMC/instances/${minecraft_version}/mods")
        if (altMultiMcMods.exists()) {
            destinations.add(altMultiMcMods)
        }

        destinations.each { targetDir ->
            if (!targetDir.exists()) {
                targetDir.mkdirs()
            }

            // Remove any previous versions of this mod in the target directory
            targetDir.listFiles()?.each { existingFile ->
                if ((existingFile.name.startsWith("villagerai-") ||
                     existingFile.name.startsWith("evv-") ||
                     existingFile.name.startsWith("easy-vanilla-villagers-")) && existingFile.name.endsWith('.jar')) {
                    existingFile.delete()
                    println "Removed old mod jar: ${existingFile.name} from ${targetDir.absolutePath}"
                }
            }

            copy {
                from jarFile
                into targetDir
            }
            println "Copied ${jarFile.name} -> ${targetDir.absolutePath}"
        }
    }
}

